<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Indigo to Deep Violet (#312e81 to #7e22ce) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <!-- Golden Sparkle Gradient (#f59e0b to #fef08a) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Soft Drop Shadow for Pin 2 to separate from Pin 1 -->
    <filter id="pin2Shadow" x="-35%" y="-25%" width="170%" height="160%">
      <feDropShadow dx="-5" dy="6" stdDeviation="8" flood-color="#15113d" flood-opacity="0.35" />
    </filter>

    <!-- Subtle Sparkle Glow -->
    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#fbbf24" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="34" y="34" width="444" height="444" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2.5" />

  <!-- Ground Shadows: dos elipses sutiles en el suelo (fill="black" opacity="0.25") -->
  <g fill="#000000" opacity="0.25">
    <ellipse cx="205" cy="403" rx="46" ry="12" />
    <ellipse cx="325" cy="403" rx="40" ry="10" />
  </g>

  <!-- Pin 1: Izquierdo / Principal (Erguido, más alto, clásico en blanco puro #ffffff) -->
  <path
    d="M 205 395 L 144.7 226.6 A 64 64 0 1 1 265.3 226.6 Z M 205 182 A 23 23 0 1 0 205 228 A 23 23 0 1 0 205 182 Z"
    fill-rule="evenodd"
    fill="#ffffff"
  />

  <!-- Pin 2: Derecho / Compañero (Ligeramente más pequeño, inclinado apoyándose con complicidad) -->
  <g transform="translate(325, 395) rotate(-13)" filter="url(#pin2Shadow)">
    <path
      d="M 0 0 L -49.0 -137.6 A 52 52 0 1 1 49.0 -137.6 Z M 0 -174 A 19 19 0 1 0 0 -136 A 19 19 0 1 0 0 -174 Z"
      fill-rule="evenodd"
      fill="#f8fafc"
    />
  </g>

  <!-- Detalle de acento: Pequeño destello dorado de 4 puntas (#f59e0b a #fef08a) -->
  <g filter="url(#sparkleGlow)">
    <path
      d="M 382 118 Q 382 134 398 134 Q 382 134 382 150 Q 382 134 366 134 Q 382 134 382 118 Z"
      fill="url(#goldGrad)"
    />
    <circle cx="382" cy="134" r="2.5" fill="#ffffff" />
  </g>
</svg>
